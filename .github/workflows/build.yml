name: Verify Spotibai build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        env:
          # Nonfunctional placeholders for config validation in CI only.
          NEON_AUTH_BASE_URL: https://ci-placeholder.invalid/neondb/auth
          NEON_AUTH_COOKIE_SECRET: "ci-only-not-a-real-secret-placeholder-64-characters-long-00000"
        run: npm run build
